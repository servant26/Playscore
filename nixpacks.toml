[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm install --legacy-peer-deps --no-audit"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan storage:link --force && php artisan migrate --force && php artisan db:seed --force && php artisan optimize:clear && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
